name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Validate package
        run: python scripts/validate.py --strict
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  wrappers:
    name: Wrapper smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Bash syntax and real lifecycle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/install.sh
          project_dir="$(mktemp -d)"
          ./scripts/install.sh --scope project --project-dir "$project_dir"
          test -f "$project_dir/.cwc/codex-workflow-crew-state.json"
          ./scripts/install.sh --scope project --project-dir "$project_dir"
          test -f "$project_dir/.cwc/codex-workflow-crew-state.json"
          ./scripts/install.sh --scope project --project-dir "$project_dir" --uninstall
          test ! -e "$project_dir/.cwc/codex-workflow-crew-state.json"
          ./scripts/install.sh --scope project --project-dir "$project_dir"
          test -f "$project_dir/.cwc/codex-workflow-crew-state.json"
          ./scripts/install.sh --scope project --project-dir "$project_dir" --uninstall
          test ! -e "$project_dir/.cwc/codex-workflow-crew-state.json"
      - name: Windows PowerShell real lifecycle
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP "pitcrew powershell smoke"
          New-Item -ItemType Directory -Force -Path $projectDir | Out-Null
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "PowerShell install state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "PowerShell repeat install state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir -Uninstall
          if (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json")) { throw "PowerShell uninstall left state behind" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "PowerShell reinstall state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir -Uninstall
          if (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json")) { throw "PowerShell final uninstall left state behind" }
      - name: PowerShell 7 real lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $projectDir = Join-Path $env:RUNNER_TEMP "pitcrew pwsh smoke"
          New-Item -ItemType Directory -Force -Path $projectDir | Out-Null
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "pwsh install state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "pwsh repeat install state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir -Uninstall
          if (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json")) { throw "pwsh uninstall left state behind" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir
          if (-not (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json") -PathType Leaf)) { throw "pwsh reinstall state is missing" }
          .\scripts\install.ps1 -Scope Project -ProjectDir $projectDir -Uninstall
          if (Test-Path -LiteralPath (Join-Path $projectDir ".cwc\codex-workflow-crew-state.json")) { throw "pwsh final uninstall left state behind" }

  release-archive:
    name: Build and verify release archive
    needs: [validate, wrappers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Build from the exact clean commit and verify extraction
        run: python scripts/build_release.py --output-dir dist --verify-extracted
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-pit-crew-release-candidate
          path: |
            dist/production-pit-crew-0.1.0.zip
            dist/SHA256SUMS
          if-no-files-found: error
